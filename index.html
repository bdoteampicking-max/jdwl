<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Subhanallah</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%;
    background:#000;
    overflow:hidden;
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
  }
  #intro {
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#000;
    z-index:10;
  }
  #subhan {
    color:#fff;
    font-size:4vw;
    font-weight:700;
    letter-spacing:0.08em;
    text-align:center;
    opacity:0;
    transform:scale(0.1);
    transform-origin:center;
    text-shadow: 0 0 25px rgba(255,255,255,0.6);
    animation: approach 3.5s ease-out forwards;
  }
  @keyframes approach {
    0%   { opacity:0;   transform:scale(0.05); filter:blur(6px); }
    15%  { opacity:0.15;transform:scale(0.15); filter:blur(5px); }
    50%  { opacity:0.6; transform:scale(0.55); filter:blur(1.5px); }
    80%  { opacity:1;   transform:scale(0.95); filter:blur(0px); }
    100% { opacity:1;   transform:scale(1);    filter:blur(0px); }
  }
  #intro.fadeout {
    animation: fadeOutIntro 1.2s ease forwards;
  }
  @keyframes fadeOutIntro {
    from { opacity:1; }
    to   { opacity:0; visibility:hidden; }
  }

  #main {
    position:fixed;
    inset:0;
    display:none;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    background:#000;
    opacity:0;
    animation: fadeInMain 1.2s ease forwards;
  }
  #main.show { display:flex; }
  @keyframes fadeInMain {
    from { opacity:0; }
    to   { opacity:1; }
  }

  #imgWrap {
    flex:1;
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px 16px 8px 16px;
    min-height:0;
  }
  #mainImg {
    max-width:100%;
    max-height:100%;
    object-fit:contain;
    border-radius:10px;
    box-shadow:0 0 40px rgba(255,255,255,0.15);
  }

  #tickerBar {
    width:100%;
    background:linear-gradient(90deg,#1a1a1a,#2b2b2b,#1a1a1a);
    border-top:2px solid #d4af37;
    padding:12px 0;
    overflow:hidden;
    white-space:nowrap;
  }
  #ticker {
    display:inline-block;
    padding-left:100%;
    animation: scrollLeft 14s linear infinite;
  }
  .ticker-item {
    display:inline-flex;
    align-items:center;
    gap:10px;
    color:#f5e7c1;
    font-size:1.3rem;
    font-weight:600;
    padding:0 40px;
  }
  .ticker-item a {
    color:#ffd873;
    text-decoration:none;
    display:inline-flex;
    align-items:center;
    gap:8px;
  }
  .ticker-item a:hover { text-decoration:underline; }
  .phone-icon {
    width:22px;
    height:22px;
    fill:#25D366;
    flex-shrink:0;
  }
  @keyframes scrollLeft {
    from { transform:translateX(0); }
    to   { transform:translateX(-100%); }
  }

  @media (max-width:700px){
    #subhan { font-size:9vw; }
    .ticker-item { font-size:1rem; }
  }
</style>
</head>

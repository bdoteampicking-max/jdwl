<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Manpower 3 Shift</title>
<link rel="stylesheet" href="style.css" />
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

<header class="app-header">
  <div class="brand">
    <svg class="shift-ring" width="64" height="64" viewBox="0 0 100 100" aria-hidden="true">
      <circle cx="50" cy="50" r="42" fill="none" stroke="#2f3846" stroke-width="10"/>
      <!-- lingkaran penuh r=42 -> keliling ~263.76. Tiap shift = 1/3 (8 jam),
           arc 84 dipakai (sisanya jadi celah pemisah antar shift). -->
      <!-- shift 1: 07:00-15:00 -->
      <circle cx="50" cy="50" r="42" fill="none" stroke="#f2a93b" stroke-width="10"
        stroke-dasharray="84 179.76" stroke-dashoffset="0" stroke-linecap="butt"/>
      <!-- shift 2: 15:00-23:00 -->
      <circle cx="50" cy="50" r="42" fill="none" stroke="#4fbf88" stroke-width="10"
        stroke-dasharray="84 179.76" stroke-dashoffset="-87.92" stroke-linecap="butt"/>
      <!-- shift 3: 23:00-07:00 -->
      <circle cx="50" cy="50" r="42" fill="none" stroke="#e0663f" stroke-width="10"
        stroke-dasharray="84 179.76" stroke-dashoffset="-175.84" stroke-linecap="butt"/>
      <text x="50" y="55" text-anchor="middle" fill="#e7ebf1" font-size="14" font-weight="600">3×8</text>
    </svg>
    <div>
      <h1>Manpower 3 Shift</h1>
      <div class="sub" id="today-label">—</div>
    </div>
  </div>
  <div id="admin-area">
    <span id="admin-badge"></span>
    <div id="g_id_signin_container" class="g_id_signin"></div>
    <button class="btn-ghost" id="btn-logout" hidden>Keluar</button>
  </div>
</header>

<nav class="tabs">
  <button class="tab-btn active" data-view="dashboard">Dashboard</button>
  <button class="tab-btn" data-view="swap">Ajukan Tukar Libur</button>
  <button class="tab-btn" data-view="admin" id="tab-admin" hidden>Kelola Karyawan</button>
</nav>

<main>

  <!-- ===== DASHBOARD ===== -->
  <section id="view-dashboard" class="view active">
    <div class="dash-controls">
      <label for="dash-date" style="font-family:var(--font-mono); font-size:12px; color:var(--text-dim);">Tanggal</label>
      <input type="date" id="dash-date" />
    </div>
    <div id="dash-msg"></div>
    <div class="shift-columns" id="shift-columns">
      <div class="empty-state">Memuat jadwal…</div>
    </div>
  </section>

  <!-- ===== SWAP ===== -->
  <section id="view-swap" class="view">
    <div class="card">
      <h2>Ajukan Tukar Libur</h2>
      <p style="color:var(--text-dim); font-size:14px;">
        Kalau tanggal yang kamu pilih memang jadwal liburmu, sistem otomatis mencari pengganti
        dari daftar backup shift-mu.
      </p>
      <div id="swap-msg"></div>
      <div class="form-grid">
        <label>Nama
          <input type="text" id="swap-nama" list="employee-list" placeholder="Nama sesuai data karyawan" />
          <datalist id="employee-list"></datalist>
        </label>
        <label>Tanggal Libur
          <input type="date" id="swap-tanggal" />
        </label>
      </div>
      <button class="btn-primary" id="btn-swap">Ajukan</button>
    </div>
  </section>

  <!-- ===== ADMIN ===== -->
  <section id="view-admin" class="view">
    <div class="card">
      <h2>Tambah Karyawan</h2>
      <div id="admin-msg"></div>
      <div class="form-grid">
        <label>Nama <input type="text" id="f-nama" /></label>
        <label>Departemen <input type="text" id="f-departemen" value="LOGISTICS" /></label>
        <label>Jabatan <input type="text" id="f-jabatan" /></label>
        <label>Posisi Tugas <input type="text" id="f-posisi" /></label>
        <label>Shift
          <select id="f-shift">
            <option value="1">1 (07:00–15:00)</option>
            <option value="2">2 (15:00–23:00)</option>
            <option value="3">3 (23:00–07:00)</option>
          </select>
        </label>
        <label>Offset Libur (0–6) <input type="text" id="f-offset" value="0" /></label>
        <label>Nama Backup Libur <input type="text" id="f-backup" /></label>
        <label>Peran PIC (opsional)
          <input type="text" id="f-peranpic" placeholder="mis. PIC LEADER" />
        </label>
      </div>
      <button class="btn-primary" id="btn-add-employee">Simpan Karyawan</button>
    </div>

    <div class="card">
      <h2>Daftar Karyawan Aktif</h2>
      <table id="admin-table">
        <thead>
          <tr><th>ID</th><th>Nama</th><th>Shift</th><th>Jabatan</th><th>Peran PIC</th><th>Backup</th><th>Offset</th><th></th></tr>
        </thead>
        <tbody id="admin-table-body">
          <tr><td colspan="8" class="empty-state">Memuat…</td></tr>
        </tbody>
      </table>
    </div>
  </section>

</main>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
